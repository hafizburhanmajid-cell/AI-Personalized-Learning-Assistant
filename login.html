<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Log In - EduLearn AI</title>
  <link rel="stylesheet" href="./css/styles.css">
</head>
<body class="flex items-center justify-center min-h-screen bg-slate-50 p-4">

  <div class="w-full max-w-md p-8 bg-white border rounded-2xl border-slate-200 shadow-sm space-y-6">
    <div class="text-center space-y-2">
      <div class="inline-flex items-center justify-center font-bold text-white rounded-xl w-12 h-12 bg-brand-600">
        AI
      </div>
      <h1 class="text-2xl font-bold text-slate-900">Welcome Back</h1>
      <p class="text-sm text-slate-500">Log in to access your personalized learning dashboard</p>
    </div>

    <form class="space-y-4" onsubmit="event.preventDefault(); window.location.href='dashboard.html';">
      <div>
        <label class="block text-xs font-semibold text-slate-600 mb-1">Email Address</label>
        <input type="email" placeholder="ahmed@example.com" class="w-full px-3 py-2 text-sm border rounded-lg border-slate-300 focus:outline-none focus:ring-2 focus:ring-brand-500" required>
      </div>
      <div>
        <label class="block text-xs font-semibold text-slate-600 mb-1">Password</label>
        <input type="password" placeholder="••••••••" class="w-full px-3 py-2 text-sm border rounded-lg border-slate-300 focus:outline-none focus:ring-2 focus:ring-brand-500" required>
      </div>
      <button type="submit" class="w-full py-2.5 text-sm font-medium text-white rounded-lg bg-brand-600 hover:bg-brand-700 transition">
        Log In
      </button>
    </form>

    <div class="text-center text-xs text-slate-500">
      Don't have an account? 
      <a href="signup.html" class="font-semibold text-brand-600 hover:underline">Sign up</a>
    </div>
  </div>

</body>
</html>
