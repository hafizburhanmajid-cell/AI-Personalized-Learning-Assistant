<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Profile - EduLearn AI</title>
  <link rel="stylesheet" href="./css/styles.css">
</head>
<body class="flex h-screen overflow-hidden bg-slate-50">

  <!-- Sidebar -->
  <aside id="sidebar" class="fixed inset-y-0 left-0 z-30 w-64 transition-transform duration-300 transform -translate-x-full bg-white border-r md:static md:translate-x-0 border-slate-200">
    <div class="flex flex-col h-full">
      <div class="flex items-center h-16 px-6 border-b border-slate-200">
        <span class="text-xl font-bold text-slate-800">EduLearn AI</span>
      </div>
      <nav class="flex-1 px-4 py-4 space-y-1">
        <a href="dashboard.html" class="flex items-center px-4 py-3 font-medium transition rounded-lg text-slate-600 hover:bg-slate-100">Dashboard</a>
        <a href="ai-teacher.html" class="flex items-center px-4 py-3 font-medium transition rounded-lg text-slate-600 hover:bg-slate-100">AI Teacher Chat</a>
        <a href="lesson.html" class="flex items-center px-4 py-3 font-medium transition rounded-lg text-slate-600 hover:bg-slate-100">Lesson Generator</a>
        <a href="quiz.html" class="flex items-center px-4 py-3 font-medium transition rounded-lg text-slate-600 hover:bg-slate-100">AI Quizzes</a>
        <a href="progress.html" class="flex items-center px-4 py-3 font-medium transition rounded-lg text-slate-600 hover:bg-slate-100">Progress Tracker</a>
        <a href="profile.html" class="flex items-center px-4 py-3 font-medium text-white rounded-lg bg-brand-600">Profile & Preferences</a>
      </nav>
    </div>
  </aside>

  <!-- Main Container -->
  <div class="flex flex-col flex-1 overflow-y-auto">
    <header class="flex items-center justify-between h-16 px-6 bg-white border-b border-slate-200">
      <button id="mobile-menu-btn" class="p-2 border rounded-md md:hidden text-slate-600 border-slate-300">Menu</button>
      <h2 class="text-lg font-bold text-slate-800">Student Profile & Preferences</h2>
    </header>

    <main class="p-6 max-w-2xl mx-auto w-full">
      <div class="p-6 bg-white border rounded-xl border-slate-200 shadow-sm space-y-4">
        <form class="space-y-4">
          <div>
            <label class="block text-xs font-semibold text-slate-600 mb-1">Full Name</label>
            <input type="text" value="Ahmed Hassan" class="w-full px-3 py-2 text-sm border rounded-lg border-slate-300 focus:outline-none focus:ring-2 focus:ring-brand-500">
          </div>
          <div>
            <label class="block text-xs font-semibold text-slate-600 mb-1">Learning Level</label>
            <select class="w-full px-3 py-2 text-sm border rounded-lg border-slate-300 focus:outline-none focus:ring-2 focus:ring-brand-500">
              <option selected>Beginner</option>
              <option>Intermediate</option>
              <option>Advanced</option>
            </select>
          </div>
          <div>
            <label class="block text-xs font-semibold text-slate-600 mb-1">Preferred Explanation Style</label>
            <input type="text" value="Simple explanations with real-world analogies" class="w-full px-3 py-2 text-sm border rounded-lg border-slate-300 focus:outline-none focus:ring-2 focus:ring-brand-500">
          </div>
          <button type="submit" class="px-5 py-2 text-sm font-medium text-white rounded-lg bg-brand-600 hover:bg-brand-700 transition">Save Preferences</button>
        </form>
      </div>
    </main>
  </div>

  <script src="./js/app.js"></script>
  <script src="./js/profile.js"></script>
</body>
</html>
